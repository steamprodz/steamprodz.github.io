<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#edf0f2;color:#18222d}.app{display:grid;grid-template-columns:78px 330px 1fr 380px;height:100vh}
.iconbar{background:#111b26;color:#8ea0b3;padding:18px 10px;text-align:center}.mark{font-size:26px;color:#6ee7c7;margin-bottom:30px}.icon{padding:14px 0;border-radius:10px;margin:6px 0}.icon.on{background:#24384d;color:white}
.list{background:#f7f9fa;border-right:1px solid #d8dee4;overflow:auto}.listHead{padding:20px;border-bottom:1px solid #d8dee4;position:sticky;top:0;background:#f7f9fa;z-index:2}.search{width:100%;padding:11px;border:1px solid #cfd7df;border-radius:6px}.lead{padding:15px 18px;border-bottom:1px solid #e2e7eb;cursor:pointer}.lead:hover,.lead.on{background:white;border-left:4px solid #00a989}.lead b{display:block}.small{font-size:12px;color:#74808c}
.workspace{background:white;padding:24px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric{background:#f5f7f8;border:1px solid #e1e6ea;padding:16px}.metric strong{font-size:28px;display:block}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.stage{padding:12px;color:#18333c;font-weight:bold}.s1{background:#dceef9}.s2{background:#dff5e9}.s3{background:#fff1c9}.s4{background:#ffe1dc}.s5{background:#e6e3fb}
.tabs{display:flex;gap:8px;border-bottom:1px solid #e1e6ea;margin-bottom:10px}.tab{padding:10px 12px;border:0;background:transparent}.tab.on{border-bottom:3px solid #00a989;color:#007c66}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #e5e9ec;text-align:left;font-size:13px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#dff5e9;color:#0a7a61;font-size:11px}
.detail{background:#f8fafb;border-left:1px solid #d9e0e5;padding:22px;overflow:auto}.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#163f52;color:white;font-size:22px}.btn{background:#00a989;color:white;border:0;padding:10px 14px;border-radius:6px}.ghost{background:white;border:1px solid #ccd5dc;padding:9px 12px;border-radius:6px}.field{width:100%;padding:9px;border:1px solid #ccd5dc;border-radius:6px;margin:6px 0}.activity{border-left:2px solid #cfe0e5;margin-left:8px;padding-left:15px}.activity div{margin:14px 0}.tech{position:fixed;right:16px;bottom:14px;background:#111b26;color:#d5e0ea;padding:10px 14px;font-size:12px;border-radius:5px}
@media(max-width:1150px){.app{grid-template-columns:70px 280px 1fr}.detail{display:none}}@media(max-width:760px){.app{grid-template-columns:1fr}.iconbar,.list{display:none}.metrics{grid-template-columns:1fr 1fr}.pipeline{grid-template-columns:1fr}}
</style></head><body><div class="app">
<aside class="iconbar"><div class="mark">R</div><div class="icon on">▦</div><div class="icon">◉</div><div class="icon">◇</div><div class="icon">✓</div><div class="icon">▤</div><div class="icon">⚙</div></aside>
<section class="list"><div class="listHead"><h2 style="margin-top:0">Opportunities</h2><input class="search" id="q" placeholder="Search leads..."><div style="display:flex;gap:6px;margin-top:8px"><select class="field" id="stageFilter"><option>All</option><option>New</option><option>Qualified</option><option>Proposal</option><option>Negotiation</option></select><button class="ghost" onclick="alert('Demo import wizard')">Import</button></div></div><div id="leadList"></div></section>
<main class="workspace"><div class="top"><div><h1 style="margin:0">Sales workspace</h1><div class="small">Pipeline, account health and recent activity</div></div><button class="btn" onclick="addDeal()">+ New deal</button></div>
<div class="metrics" id="metrics"></div><div class="pipeline" id="pipeline"></div><div class="tabs"><button class="tab on" data-view="table">Opportunities</button><button class="tab" data-view="activity">Team activity</button><button class="tab" data-view="forecast">Forecast</button></div><div id="content"></div></main>
<aside class="detail" id="detail"></aside></div><div class="tech">ASP.NET Core · Angular · SQL Server · Entra ID · Graph API</div>
<script>
let leads=[
{id:1,n:'Sarah Mitchell',c:'Acme Corp',v:24000,s:'Proposal',a:'2h ago',o:'John Doe',email:'sarah@acme.com'},
{id:2,n:'Michael Chen',c:'Global Tech',v:18500,s:'Qualified',a:'1d ago',o:'Sarah Collins',email:'michael@global.com'},
{id:3,n:'Olivia Brown',c:'Summit Health',v:31000,s:'Negotiation',a:'3h ago',o:'Mark King',email:'olivia@summit.com'},
{id:4,n:'James Taylor',c:'Pinnacle',v:12000,s:'New',a:'4h ago',o:'John Doe',email:'james@pinnacle.com'},
{id:5,n:'Emily Davis',c:'Northwind',v:47000,s:'Qualified',a:'2d ago',o:'Sarah Collins',email:'emily@northwind.com'}
];let sel=0,view='table';
function f(){let q=document.getElementById('q').value.toLowerCase(),s=stageFilter.value;return leads.filter(x=>(!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(s==='All'||x.s===s))}
function render(){
let arr=f();leadList.innerHTML=arr.map(x=>`<div class="lead ${x.id===sel?'on':''}" data-id="${x.id}"><b>${x.n}</b><span class="small">${x.c} · $${x.v.toLocaleString()}</span><div style="margin-top:6px"><span class="badge">${x.s}</span></div></div>`).join('');
let total=leads.reduce((a,b)=>a+b.v,0),won=leads.filter(x=>x.s==='Won').reduce((a,b)=>a+b.v,0);
metrics.innerHTML=[['Open pipeline','$'+total.toLocaleString()],['Qualified',leads.filter(x=>x.s==='Qualified').length],['Won this month','$'+won.toLocaleString()],['Win rate','31%']].map(x=>`<div class="metric"><span class="small">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');
const stages=['New','Qualified','Proposal','Negotiation','Won'];pipeline.innerHTML=stages.map((s,i)=>`<div class="stage s${i+1}">${s} · ${leads.filter(x=>x.s===s).length}</div>`).join('');
if(view==='table')content.innerHTML=`<table><thead><tr><th>Account</th><th>Owner</th><th>Value</th><th>Stage</th><th>Last activity</th></tr></thead><tbody>${leads.map(x=>`<tr><td>${x.c}</td><td>${x.o}</td><td>$${x.v.toLocaleString()}</td><td><span class="badge">${x.s}</span></td><td>${x.a}</td></tr>`).join('')}</tbody></table>`;
if(view==='activity')content.innerHTML=`<div class="activity"><div><b>Call completed</b><div class="small">John Doe · Acme Corp · 42 min ago</div></div><div><b>Proposal sent</b><div class="small">Sarah Collins · Global Tech · 2h ago</div></div><div><b>Stage moved to Negotiation</b><div class="small">Mark King · Summit Health · 3h ago</div></div><div><b>New lead created</b><div class="small">System · Website form · 5h ago</div></div></div>`;
if(view==='forecast')content.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div class="metric"><span class="small">Commit</span><strong>$84k</strong></div><div class="metric"><span class="small">Best case</span><strong>$156k</strong></div><div class="metric"><span class="small">Pipeline</span><strong>$438k</strong></div></div>`;
let l=leads.find(x=>x.id===sel)||leads[0];detail.innerHTML=`<div class="avatar">${l.n.split(' ').map(x=>x[0]).join('')}</div><h2>${l.n}</h2><p class="small">${l.c}</p><span class="badge">${l.s}</span><hr><h3>Deal details</h3><label class="small">Value</label><input class="field" id="val" value="${l.v}"><label class="small">Stage</label><select class="field" id="stage">${['New','Qualified','Proposal','Negotiation','Won'].map(s=>`<option ${s===l.s?'selected':''}>${s}</option>`).join('')}</select><label class="small">Email</label><input class="field" value="${l.email}"><button class="btn" onclick="saveDeal(${l.id})">Save changes</button><h3>Recent activity</h3><div class="activity"><div><b>Email sent</b><div class="small">2h ago</div></div><div><b>Call logged</b><div class="small">Yesterday</div></div></div>`}
function addDeal(){let id=Math.max(...leads.map(x=>x.id))+1;leads.push({id,n:'New Contact',c:'New Account',v:10000,s:'New',a:'now',o:'Andrii',email:'new@example.com'});sel=id;render()}
function saveDeal(id){let l=leads.find(x=>x.id===id);l.v=+val.value||0;l.s=stage.value;l.a='now';render()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-id]');if(t){sel=+t.dataset.id;render()}if(e.target.matches('.tab')){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');view=e.target.dataset.view;render()}});q.oninput=render;stageFilter.onchange=render;render();
</script></body></html>
