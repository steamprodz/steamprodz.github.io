<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit Tasks</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:#fff8ee;color:#25202f}
header{padding:18px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #25202f;background:#fffdf8;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid #25202f;background:#ffde59;padding:9px 12px;box-shadow:3px 3px 0 #25202f}.btn.alt{background:#8bd3dd}.btn.pink{background:#f7a8c4}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:18px 26px}.pill{padding:12px 14px;border:2px solid #25202f;background:white}.pill b{display:block;font-size:20px}
.filters{display:flex;gap:10px;padding:0 26px 18px;flex-wrap:wrap}.filters input,.filters select{padding:9px;border:2px solid #25202f;background:#fff}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:0 26px 90px}.col{min-height:560px;border:2px solid #25202f;padding:12px;background:#fff}.col:nth-child(1){background:#eef8ff}.col:nth-child(2){background:#fff5c8}.col:nth-child(3){background:#f7e7ff}.col:nth-child(4){background:#e8f8e8}
.col h2{display:flex;justify-content:space-between;font-size:18px}.card{background:#fff;border:2px solid #25202f;padding:13px;margin:12px 0;box-shadow:4px 4px 0 #25202f;cursor:grab}.card.dragging{opacity:.5}.tag{font-size:11px;border:1px solid #25202f;padding:3px 6px;border-radius:999px}.progress{height:8px;background:#eee;border:1px solid #25202f;margin-top:10px}.progress span{display:block;height:100%;background:#8bd3dd}
.footer{position:fixed;left:0;right:0;bottom:0;background:#25202f;color:white;padding:10px 20px;font-size:12px}.modalWrap{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:30}.modalWrap.open{display:grid}.modal{background:#fffdf8;border:3px solid #25202f;padding:24px;width:min(620px,90vw);box-shadow:10px 10px 0 #25202f}.field{width:100%;padding:9px;border:2px solid #25202f;margin:6px 0 12px}
@media(max-width:900px){.board{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:560px){.board{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">◉ ORBIT TASKS</div><div class="toolbar"><button class="btn alt" onclick="toggleTimeline()">Timeline</button><button class="btn pink" onclick="shuffle()">Shuffle demo</button><button class="btn" onclick="openNew()">+ Add task</button></div></header>
<div class="summary" id="summary"></div><div class="filters"><input id="q" placeholder="Search tasks..."><select id="assignee"><option>All assignees</option><option>Andrii</option><option>Marta</option><option>Leo</option></select><select id="priority"><option>All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>
<main class="board" id="board"></main><div class="footer">.NET 8 · Angular 17 · SQL Server · Azure DevOps · SignalR · Drag & Drop interactions</div>
<div class="modalWrap" id="modalWrap"><div class="modal"><h2 id="modalTitle">Task</h2><label>Title</label><input class="field" id="titleField"><label>Assignee</label><select class="field" id="assigneeField"><option>Andrii</option><option>Marta</option><option>Leo</option></select><label>Priority</label><select class="field" id="priorityField"><option>High</option><option>Medium</option><option>Low</option></select><label>Progress</label><input class="field" id="progressField" type="number" min="0" max="100" value="0"><div style="display:flex;gap:8px"><button class="btn" id="saveBtn">Save</button><button class="btn alt" onclick="modalWrap.classList.remove('open')">Cancel</button></div></div></div>
<script>
let tasks=[
{id:1,t:'Design permissions matrix',tag:'Backend',a:'Andrii',p:'High',prog:20,s:'todo'},
{id:2,t:'Create invoice form',tag:'Frontend',a:'Marta',p:'Medium',prog:35,s:'todo'},
{id:3,t:'Write seed data',tag:'Database',a:'Leo',p:'Low',prog:0,s:'todo'},
{id:4,t:'Implement JWT refresh',tag:'Backend',a:'Andrii',p:'High',prog:65,s:'doing'},
{id:5,t:'Mobile responsive pass',tag:'Frontend',a:'Marta',p:'Medium',prog:70,s:'doing'},
{id:6,t:'Order API validation',tag:'Backend',a:'Leo',p:'High',prog:90,s:'review'},
{id:7,t:'Accessibility fixes',tag:'Frontend',a:'Marta',p:'Low',prog:85,s:'review'},
{id:8,t:'CI pipeline',tag:'DevOps',a:'Andrii',p:'Medium',prog:100,s:'done'},
{id:9,t:'Audit log',tag:'Backend',a:'Leo',p:'Low',prog:100,s:'done'}];let editing=null,timeline=false;
const names={todo:'TO DO',doing:'IN PROGRESS',review:'REVIEW',done:'DONE'};
function filt(){return tasks.filter(x=>(!q.value||x.t.toLowerCase().includes(q.value.toLowerCase()))&&(assignee.value==='All assignees'||x.a===assignee.value)&&(priority.value==='All priorities'||x.p===priority.value))}
function render(){let f=filt();summary.innerHTML=[['Total tasks',tasks.length],['In progress',tasks.filter(x=>x.s==='doing').length],['Review',tasks.filter(x=>x.s==='review').length],['Done',tasks.filter(x=>x.s==='done').length],['Avg progress',Math.round(tasks.reduce((a,b)=>a+b.prog,0)/tasks.length)+'%']].map(x=>`<div class="pill"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
board.style.gridTemplateColumns=timeline?'1fr':'repeat(4,1fr)';board.innerHTML=timeline?`<section class="col"><h2>SPRINT TIMELINE</h2>${f.sort((a,b)=>a.prog-b.prog).map(x=>cardHtml(x)).join('')}</section>`:Object.keys(names).map(k=>`<section class="col" data-col="${k}"><h2>${names[k]} <span>${f.filter(x=>x.s===k).length}</span></h2>${f.filter(x=>x.s===k).map(x=>cardHtml(x)).join('')}</section>`).join('');wire()}
function cardHtml(x){return `<article draggable="true" class="card" data-id="${x.id}" data-col="${x.s}"><b>${x.t}</b><p><span class="tag">${x.tag}</span> <span class="tag">${x.p}</span></p><small>${x.a}</small><div class="progress"><span style="width:${x.prog}%"></span></div><small>${x.prog}% complete</small></article>`}
function wire(){document.querySelectorAll('.card').forEach(c=>{c.ondblclick=()=>openEdit(+c.dataset.id);c.ondragstart=e=>{c.classList.add('dragging');e.dataTransfer.setData('text/plain',c.dataset.id)};c.ondragend=()=>c.classList.remove('dragging')});document.querySelectorAll('.col[data-col]').forEach(col=>{col.ondragover=e=>e.preventDefault();col.ondrop=e=>{e.preventDefault();let t=tasks.find(x=>x.id==e.dataTransfer.getData('text/plain'));t.s=col.dataset.col;if(t.s==='done')t.prog=100;render()}})}
function openNew(){editing=null;modalTitle.textContent='New task';titleField.value='';assigneeField.value='Andrii';priorityField.value='Medium';progressField.value=0;modalWrap.classList.add('open')}
function openEdit(id){editing=id;let t=tasks.find(x=>x.id===id);modalTitle.textContent='Edit task';titleField.value=t.t;assigneeField.value=t.a;priorityField.value=t.p;progressField.value=t.prog;modalWrap.classList.add('open')}
saveBtn.onclick=()=>{if(editing){let t=tasks.find(x=>x.id===editing);t.t=titleField.value;t.a=assigneeField.value;t.p=priorityField.value;t.prog=+progressField.value}else{tasks.push({id:Date.now(),t:titleField.value||'Untitled task',tag:'General',a:assigneeField.value,p:priorityField.value,prog:+progressField.value,s:'todo'})}modalWrap.classList.remove('open');render()}
function shuffle(){const s=['todo','doing','review','done'];tasks.forEach((x,i)=>x.s=s[(i+1)%4]);render()}function toggleTimeline(){timeline=!timeline;render()}
[q,assignee,priority].forEach(x=>x.oninput=render);render();
</script></body></html>
